<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Usuarios · Spot Market</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet" />
    <link href="/assets/css/estilos.css" rel="stylesheet" />
  </head>
  <body>
    <div id="barra-navegacion"></div>

    <main class="container py-4">
      <div class="d-flex flex-wrap justify-content-between align-items-center mb-4 gap-2">
        <div>
          <h1 class="h4 fw-bold text-verde mb-0">Usuarios de Spot Market</h1>
          <p class="text-body-secondary small mb-0">Vecinos, comercios, restaurantes y mayoristas</p>
        </div>
        <button class="btn btn-outline-success d-none" id="boton-mi-perfil" data-bs-toggle="modal" data-bs-target="#modal-perfil">
          <i class="bi bi-person-gear"></i> Mi perfil
        </button>
      </div>

      <div id="area-alerta"></div>
      <div id="area-compradores"></div>
    </main>

    <div class="modal fade" id="modal-perfil" tabindex="-1">
      <div class="modal-dialog modal-dialog-centered">
        <div class="modal-content">
          <div class="modal-header">
            <h5 class="modal-title">Mi perfil de usuario</h5>
            <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
          </div>
          <div class="modal-body">
            <div id="alerta-perfil"></div>
            <form id="form-perfil">
              <div class="mb-3">
                <label class="form-label small fw-semibold">Nombre</label>
                <input type="text" class="form-control" id="per-nombre" required />
              </div>
              <div class="mb-3">
                <label class="form-label small fw-semibold">Teléfono</label>
                <input type="tel" class="form-control" id="per-telefono" />
              </div>
              <div class="mb-3">
                <label class="form-label small fw-semibold">Ubicación</label>
                <input type="text" class="form-control" id="per-ubicacion" required />
              </div>
              <div class="mb-3">
                <label class="form-label small fw-semibold">Tipo</label>
                <select class="form-select" id="per-tipo">
                  <option value="vecino">Vecino / consumidor</option>
                  <option value="comercio">Comercio</option>
                  <option value="restaurante">Restaurante</option>
                  <option value="mayorista">Mayorista</option>
                </select>
              </div>
            </form>
          </div>
          <div class="modal-footer">
            <button type="button" class="btn btn-light" data-bs-dismiss="modal">Cancelar</button>
            <button type="submit" form="form-perfil" class="btn btn-verde">Guardar</button>
          </div>
        </div>
      </div>
    </div>

    <div class="modal fade" id="modal-vinculados" tabindex="-1">
      <div class="modal-dialog modal-dialog-centered">
        <div class="modal-content">
          <div class="modal-header">
            <h5 class="modal-title">Comercios con los que opero</h5>
            <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
          </div>
          <div class="modal-body" id="cuerpo-vinculados"></div>
          <div class="modal-footer">
            <button type="button" class="btn btn-light" data-bs-dismiss="modal">Cerrar</button>
          </div>
        </div>
      </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script type="module" src="/assets/js/compradores.js"></script>
  </body>
</html>
