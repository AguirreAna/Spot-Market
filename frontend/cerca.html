<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Cerca de mí · Spot Market</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet" />
    <link href="/assets/css/estilos.css" rel="stylesheet" />
  </head>
  <body>
    <div id="barra-navegacion"></div>

    <main class="container py-4">
      <div class="d-flex flex-wrap justify-content-between align-items-center gap-2 mb-4">
        <div>
          <h1 class="h4 fw-bold text-verde mb-0"><i class="bi bi-geo-alt"></i> Comercios cerca de mí</h1>
          <p class="text-body-secondary small mb-0">Usamos tu ubicación para mostrar los locales más cercanos</p>
        </div>
        <button class="btn btn-verde" id="boton-geolocalizar">
          <i class="bi bi-crosshair"></i> Usar mi ubicación
        </button>
      </div>

      <div id="area-alerta"></div>

      <div class="card shadow-sm border-0 mb-4">
        <div class="card-body">
          <div class="row g-3 align-items-end">
            <div class="col-md-2">
              <label class="form-label small fw-semibold">Radio</label>
              <select class="form-select" id="filtro-radio">
                <option value="1">1 km</option>
                <option value="3">3 km</option>
                <option value="5" selected>5 km</option>
                <option value="10">10 km</option>
                <option value="25">25 km</option>
              </select>
            </div>
            <div class="col-md-3">
              <label class="form-label small fw-semibold">Categoría</label>
              <select class="form-select" id="filtro-categoria">
                <option value="">Todas</option>
                <option value="minorista">Minorista</option>
                <option value="mayorista">Mayorista</option>
                <option value="ambos">Mayorista y minorista</option>
              </select>
            </div>
            <div class="col-md-4">
              <label class="form-label small fw-semibold">Tipo de producto</label>
              <select class="form-select" id="filtro-tipo"><option value="">Todos</option></select>
            </div>
            <div class="col-md-3">
              <button class="btn btn-outline-success w-100" id="boton-aplicar">
                <i class="bi bi-funnel"></i> Aplicar filtros
              </button>
            </div>
          </div>
          <div class="small text-body-secondary mt-3" id="estado-cerca">
            Presioná "Usar mi ubicación" para empezar.
          </div>
        </div>
      </div>

      <div id="area-cerca"></div>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script type="module" src="/assets/js/cerca.js"></script>
  </body>
</html>
