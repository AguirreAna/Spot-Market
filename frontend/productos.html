<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Productos · Spot Market</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet" />
    <link href="/assets/css/estilos.css" rel="stylesheet" />
  </head>
  <body>
    <div id="barra-navegacion"></div>

    <main class="container py-4">
      <div class="d-flex flex-wrap justify-content-between align-items-center mb-4 gap-2">
        <div>
          <h1 class="h4 fw-bold text-verde mb-0">Productos y ofertas</h1>
          <p class="text-body-secondary small mb-0" data-texto-rol></p>
        </div>
        <div class="d-flex gap-2">
          <a class="btn btn-outline-success d-none" id="boton-mi-perfil" href="/productores.html">
            <i class="bi bi-shop"></i> Mi perfil
          </a>
          <button class="btn btn-verde d-none" id="boton-nuevo-producto" data-bs-toggle="modal" data-bs-target="#modal-producto">
            <i class="bi bi-plus-lg"></i> Publicar producto
          </button>
        </div>
      </div>

      <div id="area-alerta"></div>
      <div id="chip-comercio" class="mb-3"></div>

      <div class="card shadow-sm border-0 mb-4">
        <div class="card-body">
          <div class="row g-3 align-items-end">
            <div class="col-md-4">
              <label class="form-label small fw-semibold">Buscar</label>
              <input type="search" class="form-control" id="filtro-q" placeholder="Nombre o descripción..." />
            </div>
            <div class="col-md-2">
              <label class="form-label small fw-semibold">Tipo</label>
              <select class="form-select" id="filtro-tipo"><option value="">Todos</option></select>
            </div>
            <div class="col-md-2">
              <label class="form-label small fw-semibold">Orden</label>
              <select class="form-select" id="filtro-orden">
                <option value="">Más recientes</option>
                <option value="precio_asc">Menor precio</option>
                <option value="precio_desc">Mayor precio</option>
                <option value="calificacion">Mejor calificados</option>
              </select>
            </div>
            <div class="col-md-2">
              <label class="form-label small fw-semibold">Precio mínimo</label>
              <input type="number" min="0" step="0.01" class="form-control" id="filtro-precio-min" placeholder="$ 0" />
            </div>
            <div class="col-md-2">
              <label class="form-label small fw-semibold">Precio máximo</label>
              <input type="number" min="0" step="0.01" class="form-control" id="filtro-precio-max" placeholder="$ 100000" />
            </div>
          </div>
          <div class="d-flex gap-2 mt-3">
            <button class="btn btn-verde btn-sm" id="boton-aplicar-filtros"><i class="bi bi-funnel"></i> Aplicar filtros</button>
            <button class="btn btn-outline-secondary btn-sm" id="boton-limpiar-filtros">Limpiar</button>
          </div>
        </div>
      </div>

      <div id="area-productos"></div>
    </main>

    <div class="modal fade" id="modal-producto" tabindex="-1">
      <div class="modal-dialog modal-dialog-centered modal-lg">
        <div class="modal-content">
          <div class="modal-header">
            <h5 class="modal-title" id="titulo-producto">Publicar producto</h5>
            <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
          </div>
          <div class="modal-body">
            <div id="alerta-producto"></div>
            <form id="form-producto">
              <div class="row g-3">
                <div class="col-md-7">
                  <label class="form-label small fw-semibold">Nombre</label>
                  <input type="text" class="form-control" id="p-nombre" required />
                </div>
                <div class="col-md-5">
                  <label class="form-label small fw-semibold">Tipo de producto</label>
                  <select class="form-select" id="p-tipo"><option value="">Sin categoría</option></select>
                </div>
                <div class="col-12">
                  <label class="form-label small fw-semibold">Descripción</label>
                  <textarea class="form-control" id="p-descripcion" rows="2" required placeholder="Qué es y para quién es..."></textarea>
                </div>
                <div class="col-12">
                  <label class="form-label small fw-semibold">Especificación</label>
                  <textarea class="form-control" id="p-especificacion" rows="2" placeholder="Peso, medidas, origen, presentación, vencimiento..."></textarea>
                </div>
                <div class="col-md-4">
                  <label class="form-label small fw-semibold">Precio ($)</label>
                  <input type="number" step="0.01" min="0.01" class="form-control" id="p-precio" required />
                </div>
                <div class="col-md-4">
                  <label class="form-label small fw-semibold">Precio oferta ($)</label>
                  <input type="number" step="0.01" min="0.01" class="form-control" id="p-precio-oferta" placeholder="Opcional" />
                </div>
                <div class="col-md-4">
                  <label class="form-label small fw-semibold">Stock</label>
                  <input type="number" min="0" class="form-control" id="p-stock" required />
                </div>
                <div class="col-12">
                  <label class="form-label small fw-semibold">Foto del producto</label>
                  <input type="file" class="form-control" id="p-imagen" accept="image/*" />
                  <div class="form-text">Opcional. Se sube al guardar el producto.</div>
                  <div id="p-imagen-previa" class="mt-2"></div>
                </div>
              </div>
            </form>
          </div>
          <div class="modal-footer">
            <button type="button" class="btn btn-light" data-bs-dismiss="modal">Cancelar</button>
            <button type="submit" form="form-producto" class="btn btn-verde" id="boton-guardar-producto">Publicar</button>
          </div>
        </div>
      </div>
    </div>

    <div class="modal fade" id="modal-pedido" tabindex="-1">
      <div class="modal-dialog modal-dialog-centered">
        <div class="modal-content">
          <div class="modal-header">
            <h5 class="modal-title" id="titulo-pedido">Nuevo pedido</h5>
            <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
          </div>
          <div class="modal-body">
            <p class="small text-body-secondary mb-3" id="info-pedido"></p>
            <div id="alerta-pedido"></div>
            <form id="form-pedido">
              <div class="mb-3">
                <label class="form-label small fw-semibold">Cantidad</label>
                <input type="number" min="1" class="form-control" id="ped-cantidad" required />
              </div>
              <div class="mb-2">
                <label class="form-label small fw-semibold">Precio negociado ($)</label>
                <input type="number" step="0.01" min="0.01" class="form-control" id="ped-precio" required />
              </div>
              <div class="form-text">
                Para confirmarse, este precio debe coincidir con una oferta enviada en el chat.
              </div>
            </form>
          </div>
          <div class="modal-footer">
            <button type="button" class="btn btn-light" data-bs-dismiss="modal">Cancelar</button>
            <button type="submit" form="form-pedido" class="btn btn-naranja">Crear pedido</button>
          </div>
        </div>
      </div>
    </div>

    <div class="modal fade" id="modal-confirmar" tabindex="-1">
      <div class="modal-dialog modal-dialog-centered modal-sm">
        <div class="modal-content">
          <div class="modal-header">
            <h5 class="modal-title">Confirmar eliminación</h5>
            <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
          </div>
          <div class="modal-body">
            <p class="mb-0 text-body-secondary" id="texto-confirmar"></p>
          </div>
          <div class="modal-footer">
            <button type="button" class="btn btn-light" data-bs-dismiss="modal">Cancelar</button>
            <button type="button" class="btn btn-danger" id="boton-eliminar-confirmado">Sí, eliminar</button>
          </div>
        </div>
      </div>
    </div>

    <div class="modal fade" id="modal-calificar" tabindex="-1">
      <div class="modal-dialog modal-dialog-centered">
        <div class="modal-content">
          <div class="modal-header">
            <h5 class="modal-title" id="titulo-calificar">Calificar producto</h5>
            <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
          </div>
          <div class="modal-body">
            <div id="alerta-calificar"></div>
            <p class="small text-body-secondary">Tu opinión ayuda a otros usuarios a elegir mejor.</p>
            <div class="rating-selector mb-3" id="rating-producto" data-valor="5">
              <span data-estrella="1">★</span>
              <span data-estrella="2">★</span>
              <span data-estrella="3">★</span>
              <span data-estrella="4">★</span>
              <span data-estrella="5">★</span>
            </div>
            <label class="form-label small fw-semibold">Comentario (opcional)</label>
            <textarea class="form-control" id="comentario-producto" rows="3" maxlength="500"></textarea>
          </div>
          <div class="modal-footer">
            <button type="button" class="btn btn-light" data-bs-dismiss="modal">Cancelar</button>
            <button type="button" class="btn btn-verde" id="boton-enviar-calificacion-producto">Enviar calificación</button>
          </div>
        </div>
      </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script type="module" src="/assets/js/productos.js"></script>
  </body>
</html>
