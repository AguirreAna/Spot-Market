<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Comercios · Spot Market</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet" />
    <link href="/assets/css/estilos.css" rel="stylesheet" />
  </head>
  <body>
    <div id="barra-navegacion"></div>

    <main class="container py-4">
      <div class="d-flex flex-wrap justify-content-between align-items-center mb-4 gap-2">
        <div>
          <h1 class="h4 fw-bold text-verde mb-0">Comercios de la zona</h1>
          <p class="text-body-secondary small mb-0">Mayoristas y minoristas, con sus productos y calificaciones</p>
        </div>
        <div class="d-flex gap-2">
          <a class="btn btn-outline-success" href="/cerca.html"><i class="bi bi-geo-alt"></i> Cerca de mí</a>
          <button class="btn btn-verde d-none" id="boton-mi-perfil" data-bs-toggle="modal" data-bs-target="#modal-perfil">
            <i class="bi bi-person-gear"></i> Mi perfil
          </button>
        </div>
      </div>

      <div id="area-alerta"></div>

      <div class="card shadow-sm border-0 mb-4">
        <div class="card-body">
          <div class="row g-3 align-items-end">
            <div class="col-md-4">
              <label class="form-label small fw-semibold">Buscar</label>
              <input type="search" class="form-control" id="filtro-q" placeholder="Nombre del local, barrio..." />
            </div>
            <div class="col-md-3">
              <label class="form-label small fw-semibold">Categoría</label>
              <select class="form-select" id="filtro-categoria">
                <option value="">Todas</option>
                <option value="minorista">Minorista</option>
                <option value="mayorista">Mayorista</option>
                <option value="ambos">Mayorista y minorista</option>
              </select>
            </div>
            <div class="col-md-3">
              <label class="form-label small fw-semibold">Tipo de producto</label>
              <select class="form-select" id="filtro-tipo"><option value="">Todos</option></select>
            </div>
            <div class="col-md-2">
              <label class="form-label small fw-semibold">Orden</label>
              <select class="form-select" id="filtro-orden">
                <option value="">Nombre</option>
                <option value="calificacion">Mejor calificados</option>
              </select>
            </div>
          </div>
          <div class="d-flex gap-2 mt-3">
            <button class="btn btn-verde btn-sm" id="boton-aplicar-filtros"><i class="bi bi-funnel"></i> Aplicar filtros</button>
            <button class="btn btn-outline-secondary btn-sm" id="boton-limpiar-filtros">Limpiar</button>
          </div>
        </div>
      </div>

      <div id="area-comercios"></div>
    </main>

    <div class="modal fade" id="modal-perfil" tabindex="-1">
      <div class="modal-dialog modal-dialog-centered modal-lg">
        <div class="modal-content">
          <div class="modal-header">
            <h5 class="modal-title">Mi perfil de comercio</h5>
            <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
          </div>
          <div class="modal-body">
            <div id="alerta-perfil"></div>
            <form id="form-perfil">
              <div class="row g-3">
                <div class="col-md-6">
                  <label class="form-label small fw-semibold">Nombre del responsable</label>
                  <input type="text" class="form-control" id="per-nombre" required />
                </div>
                <div class="col-md-6">
                  <label class="form-label small fw-semibold">Nombre del local</label>
                  <input type="text" class="form-control" id="per-nombre-local" required />
                </div>
                <div class="col-md-6">
                  <label class="form-label small fw-semibold">Teléfono</label>
                  <input type="tel" class="form-control" id="per-telefono" required />
                </div>
                <div class="col-md-6">
                  <label class="form-label small fw-semibold">Categoría</label>
                  <select class="form-select" id="per-categoria">
                    <option value="minorista">Minorista</option>
                    <option value="mayorista">Mayorista</option>
                    <option value="ambos">Mayorista y minorista</option>
                  </select>
                </div>
                <div class="col-12">
                  <label class="form-label small fw-semibold">Ubicación del local</label>
                  <div class="input-group">
                    <input type="text" class="form-control" id="per-ubicacion" required />
                    <button type="button" class="btn btn-outline-success" id="per-boton-ubicacion">
                      <i class="bi bi-geo-alt"></i> Usar mi ubicación
                    </button>
                  </div>
                  <div class="form-text" id="per-estado-ubicacion"></div>
                  <input type="hidden" id="per-latitud" />
                  <input type="hidden" id="per-longitud" />
                </div>
                <div class="col-12">
                  <label class="form-label small fw-semibold">Tipos de productos</label>
                  <div class="tipos-grid" id="per-tipos"></div>
                </div>
                <div class="col-12">
                  <label class="form-label small fw-semibold">Descripción</label>
                  <textarea class="form-control" id="per-descripcion" rows="2" maxlength="1000"></textarea>
                </div>
                <div class="col-12">
                  <label class="form-label small fw-semibold">Agregar fotos</label>
                  <input type="file" class="form-control" id="per-fotos" accept="image/*" multiple />
                  <div class="form-text">Las nuevas fotos se suman a las existentes.</div>
                  <div id="per-fotos-previa" class="d-flex gap-2 flex-wrap mt-2"></div>
                </div>
              </div>
            </form>
          </div>
          <div class="modal-footer">
            <button type="button" class="btn btn-light" data-bs-dismiss="modal">Cancelar</button>
            <button type="submit" form="form-perfil" class="btn btn-verde" id="boton-guardar-perfil">Guardar</button>
          </div>
        </div>
      </div>
    </div>

    <div class="modal fade" id="modal-calificar" tabindex="-1">
      <div class="modal-dialog modal-dialog-centered">
        <div class="modal-content">
          <div class="modal-header">
            <h5 class="modal-title" id="titulo-calificar">Calificar comercio</h5>
            <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
          </div>
          <div class="modal-body">
            <div id="alerta-calificar"></div>
            <div class="rating-selector mb-3" id="rating-comercio" data-valor="5">
              <span data-estrella="1">★</span>
              <span data-estrella="2">★</span>
              <span data-estrella="3">★</span>
              <span data-estrella="4">★</span>
              <span data-estrella="5">★</span>
            </div>
            <label class="form-label small fw-semibold">Comentario (opcional)</label>
            <textarea class="form-control" id="comentario-comercio" rows="3" maxlength="500"></textarea>
          </div>
          <div class="modal-footer">
            <button type="button" class="btn btn-light" data-bs-dismiss="modal">Cancelar</button>
            <button type="button" class="btn btn-verde" id="boton-enviar-calificacion-comercio">Enviar calificación</button>
          </div>
        </div>
      </div>
    </div>

    <div class="modal fade" id="modal-resenas" tabindex="-1">
      <div class="modal-dialog modal-dialog-centered modal-lg">
        <div class="modal-content">
          <div class="modal-header">
            <h5 class="modal-title" id="titulo-resenas">Reseñas</h5>
            <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
          </div>
          <div class="modal-body" id="cuerpo-resenas"></div>
          <div class="modal-footer">
            <button type="button" class="btn btn-light" data-bs-dismiss="modal">Cerrar</button>
          </div>
        </div>
      </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script type="module" src="/assets/js/productores.js"></script>
  </body>
</html>
