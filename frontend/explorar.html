<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Explorar · Spot Market</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet" />
    <link href="/assets/css/estilos.css" rel="stylesheet" />
  </head>
  <body>
    <div id="barra-navegacion"></div>

    <main class="container py-4">
      <div class="hero hero-publico rounded-4 text-white p-4 p-md-5 mb-4">
        <div class="row align-items-center g-4">
          <div class="col-lg-7">
            <h1 class="h2 fw-bold mb-2">Descubrí comercios y ofertas cerca tuyo</h1>
            <p class="text-white-50 mb-0">
              Explorá el catálogo sin registrarte. Para ver locales cercanos, filtrar por precio y calificar,
              creá tu cuenta gratis.
            </p>
          </div>
          <div class="col-lg-5">
            <div class="bg-white rounded-3 p-3 shadow-sm">
              <label class="form-label small fw-semibold text-verde mb-1">Buscar</label>
              <div class="input-group">
                <span class="input-group-text bg-white"><i class="bi bi-search"></i></span>
                <input type="search" id="busqueda" class="form-control" placeholder="Comercio, producto, barrio..." />
                <button class="btn btn-naranja" id="boton-buscar" type="button">Buscar</button>
              </div>
              <button class="btn btn-outline-success w-100 mt-2" id="boton-cerca">
                <i class="bi bi-geo-alt"></i> Ver locales cerca de mí
              </button>
            </div>
          </div>
        </div>
      </div>

      <div id="area-alerta"></div>

      <div class="d-flex flex-wrap justify-content-between align-items-center gap-2 mb-3">
        <ul class="nav nav-pills" id="tabs-explorar">
          <li class="nav-item"><button class="nav-link active" data-vista="comercios">Comercios</button></li>
          <li class="nav-item"><button class="nav-link" data-vista="productos">Productos</button></li>
        </ul>
        <span class="small text-body-secondary" id="resumen-explorar"></span>
      </div>

      <div class="card shadow-sm border-0 mb-4">
        <div class="card-body">
          <div class="row g-3 align-items-end">
            <div class="col-md-3">
              <label class="form-label small fw-semibold">Categoría</label>
              <select class="form-select" id="filtro-categoria">
                <option value="">Todas</option>
                <option value="minorista">Minorista</option>
                <option value="mayorista">Mayorista</option>
                <option value="ambos">Mayorista y minorista</option>
              </select>
            </div>
            <div class="col-md-3">
              <label class="form-label small fw-semibold">Tipo de producto</label>
              <select class="form-select" id="filtro-tipo"><option value="">Todos</option></select>
            </div>
            <div class="col-md-3">
              <label class="form-label small fw-semibold">Ordenar por</label>
              <select class="form-select" id="filtro-orden">
                <option value="">Más recientes</option>
                <option value="calificacion">Mejor calificados</option>
              </select>
            </div>
            <div class="col-md-3">
              <button class="btn btn-outline-secondary w-100" id="boton-limpiar">Limpiar filtros</button>
            </div>
          </div>

          <div class="row g-3 align-items-end mt-1">
            <div class="col-md-3">
              <label class="form-label small fw-semibold">Precio mínimo</label>
              <input type="number" min="0" step="0.01" class="form-control" id="filtro-precio-min" placeholder="$ 0" />
            </div>
            <div class="col-md-3">
              <label class="form-label small fw-semibold">Precio máximo</label>
              <input type="number" min="0" step="0.01" class="form-control" id="filtro-precio-max" placeholder="$ 100000" />
            </div>
            <div class="col-md-6">
              <div class="gate-card p-2 px-3 d-flex align-items-center justify-content-between gap-2" id="gate-precio">
                <div class="small">
                  <i class="bi bi-lock-fill text-naranja"></i>
                  <span id="texto-gate-precio">Registrate para filtrar por precio</span>
                </div>
                <a class="btn btn-naranja btn-sm" href="/registro.html?motivo=filtro%20por%20precio" id="boton-gate-precio">Crear cuenta</a>
              </div>
            </div>
          </div>
        </div>
      </div>

      <div id="area-explorar"></div>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script type="module" src="/assets/js/explorar.js"></script>
  </body>
</html>
