<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Pedidos · Spot Market</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet" />
    <link href="/assets/css/estilos.css" rel="stylesheet" />
  </head>
  <body>
    <div id="barra-navegacion"></div>

    <main class="container py-4">
      <div class="d-flex flex-wrap justify-content-between align-items-center mb-4 gap-2">
        <div>
          <h1 class="h4 fw-bold text-verde mb-0">Pedidos</h1>
          <p class="text-body-secondary small mb-0">Seguimiento de pedidos, confirmación y entrega</p>
        </div>
        <div class="btn-group btn-group-sm" role="group" aria-label="Filtro">
          <button type="button" class="btn btn-outline-success filtro-estado activo" data-estado="">Todos</button>
          <button type="button" class="btn btn-outline-success filtro-estado" data-estado="pendiente">Pendientes</button>
          <button type="button" class="btn btn-outline-success filtro-estado" data-estado="confirmado">Confirmados</button>
          <button type="button" class="btn btn-outline-success filtro-estado" data-estado="entregado">Entregados</button>
        </div>
      </div>

      <div id="area-alerta"></div>
      <div id="area-transacciones"></div>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script type="module" src="/assets/js/transacciones.js"></script>
  </body>
</html>
