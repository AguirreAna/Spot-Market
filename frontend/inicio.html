<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Inicio · Spot Market</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet" />
    <link href="/assets/css/estilos.css" rel="stylesheet" />
  </head>
  <body>
    <div id="barra-navegacion"></div>

    <main class="container py-4">
      <div class="hero rounded-4 text-white p-4 p-md-5 mb-4">
        <div class="row align-items-center g-3">
          <div class="col-lg-8">
            <h1 class="h2 fw-bold mb-1" id="saludo">Hola</h1>
            <p class="mb-0 text-white-50" id="saludo-descripcion"></p>
          </div>
          <div class="col-lg-4 d-flex gap-2 justify-content-lg-end flex-wrap" id="acciones-rapidas"></div>
        </div>
      </div>

      <div id="area-alerta"></div>

      <div class="row g-3" id="area-estadisticas"></div>

      <div class="row g-4 mt-1">
        <div class="col-lg-6">
          <div class="card shadow-sm h-100 border-0">
            <div class="card-header bg-white fw-semibold text-verde">
              <i class="bi bi-box-seam"></i> Productos recientes
              <a class="small float-end text-decoration-none" href="/productos.html">Ver todos</a>
            </div>
            <div class="card-body" id="area-productos"></div>
          </div>
        </div>
        <div class="col-lg-6">
          <div class="card shadow-sm h-100 border-0">
            <div class="card-header bg-white fw-semibold text-verde">
              <i class="bi bi-shop"></i> Comercios mejor calificados
              <a class="small float-end text-decoration-none" href="/productores.html">Ver todos</a>
            </div>
            <div class="card-body" id="area-comercios"></div>
          </div>
        </div>
        <div class="col-12">
          <div class="card shadow-sm border-0">
            <div class="card-header bg-white fw-semibold text-verde">
              <i class="bi bi-receipt"></i> Últimos pedidos
              <a class="small float-end text-decoration-none" href="/transacciones.html">Ver todos</a>
            </div>
            <div class="card-body" id="area-transacciones"></div>
          </div>
        </div>
      </div>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script type="module" src="/assets/js/inicio.js"></script>
  </body>
</html>
